<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="32" height="32" fill="#0d0d0d"/>
  <!-- Green pixel border -->
  <rect x="1" y="1" width="30" height="2" fill="#2d5a27"/>
  <rect x="1" y="29" width="30" height="2" fill="#2d5a27"/>
  <rect x="1" y="1" width="2" height="30" fill="#2d5a27"/>
  <rect x="29" y="1" width="2" height="30" fill="#2d5a27"/>
  <!-- Pixel M — 5×5 grid, 4px per pixel, offset 6,6 -->
  <!-- Row 0 -->
  <rect x="6"  y="6"  width="4" height="4" fill="#55ff55"/>
  <rect x="22" y="6"  width="4" height="4" fill="#55ff55"/>
  <!-- Row 1 -->
  <rect x="6"  y="10" width="4" height="4" fill="#55ff55"/>
  <rect x="10" y="10" width="4" height="4" fill="#55ff55"/>
  <rect x="18" y="10" width="4" height="4" fill="#55ff55"/>
  <rect x="22" y="10" width="4" height="4" fill="#55ff55"/>
  <!-- Row 2 (all) -->
  <rect x="6"  y="14" width="4" height="4" fill="#55ff55"/>
  <rect x="10" y="14" width="4" height="4" fill="#55ff55"/>
  <rect x="14" y="14" width="4" height="4" fill="#55ff55"/>
  <rect x="18" y="14" width="4" height="4" fill="#55ff55"/>
  <rect x="22" y="14" width="4" height="4" fill="#55ff55"/>
  <!-- Row 3 -->
  <rect x="6"  y="18" width="4" height="4" fill="#55ff55"/>
  <rect x="22" y="18" width="4" height="4" fill="#55ff55"/>
  <!-- Row 4 -->
  <rect x="6"  y="22" width="4" height="4" fill="#55ff55"/>
  <rect x="22" y="22" width="4" height="4" fill="#55ff55"/>
</svg>
